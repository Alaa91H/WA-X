[versions]
arscblamer = "1.0"
bcpkix-jdk18on = "1.86"
betterypermissionhelper = "1.0.3"
core = "6.0.0"
documentfile = "1.1.0"
filepicker = "10.1.3"
flatbuffers = "25.2.10"
jstyleparser = "4.0.1"
okhttp = "5.5.0"
xposed-legacy = "82"
libxposed-modern = "102.0.0"
agp = "9.5.0-alpha08"
colorpicker = "1.1.0"
roomRuntime = "2.8.5"
nav = "2.10.2"
kotlin = "2.4.21"
markwon = "4.6.2"
remotePreferences = "0.8"
detekt = "2.0.0-alpha.6"
spotless = "8.10.4"
# Compose. One BOM for the whole Compose surface so the runtime, UI and Material3
# artifacts cannot drift apart, with Material3 pinned explicitly to the stable
# 1.4.0 rather than inherited, because a BOM upgrade silently moving Material3 to a
# pre-release is exactly the kind of change that should be visible in a diff.
composeBom = "2026.09.00"
composeMaterial3 = "1.4.0"
activityCompose = "1.13.0"
lifecycleRuntimeCompose = "2.11.0"
lifecycleViewmodelCompose = "2.11.0"
junit = "4.13.2"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestExtJunit = "1.3.0"
espressoCore = "3.7.0"


[libraries]
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomRuntime" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "roomRuntime" }
arscblamer = { module = "com.github.DavidArsene:arscblamer", version.ref = "arscblamer" }
bcpkix-jdk18on = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bcpkix-jdk18on" }
betterypermissionhelper = { module = "com.waseemsabir:betterypermissionhelper", version.ref = "betterypermissionhelper" }
colorpicker = { module = "com.jaredrummler:colorpicker", version.ref = "colorpicker" }
core = { module = "com.github.topjohnwu.libsu:core", version.ref = "core" }
filepicker = { module = "io.github.tutorialsandroid:filepicker", version.ref = "filepicker" }
flatbuffers = { module = "com.google.flatbuffers:flatbuffers-java", version.ref = "flatbuffers" }
jstyleparser = { module = "net.sf.cssbox:jstyleparser", version.ref = "jstyleparser" }
libxposed-legacy = { group = "de.robv.android.xposed", name = "api", version.ref = "xposed-legacy" }
libxposed-modern-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposed-modern" }

androidx-activity = { module = "androidx.activity:activity", version = "1.13.0" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.2" }
androidx-fragment = { module = "androidx.fragment:fragment", version = "1.9.1" }
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "nav" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "nav" }
androidx-preference = { module = "androidx.preference:preference", version = "1.2.1" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
rikkax-appcompat = { module = "dev.rikka.rikkax.appcompat:appcompat", version = "1.6.1" }
rikkax-core = { module = "dev.rikka.rikkax.core:core", version = "1.4.1" }
rikkax-material = { module = "dev.rikka.rikkax.material:material", version = "2.7.2" }
rikkax-material-preference = { module = "dev.rikka.rikkax.material:material-preference", version = "2.0.0" }
rikkax-widget-borderview = { module = "dev.rikka.rikkax.widget:borderview", version = "1.1.0" }
material = { module = "com.google.android.material:material", version = "1.14.0" }
markwon-core = { module = "io.noties.markwon:core", version.ref = "markwon" }
remote-preferences = { module = "com.crossbowffs.remotepreferences:remotepreferences", version.ref = "remotePreferences" }


# --- Compose -----------------------------------------------------------------
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }

[plugins]

# The Compose compiler is its own Gradle plugin from Kotlin 2.0 onwards, and its
# version tracks the Kotlin version, so it is derived rather than pinned separately.
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kspPlugin = { id = "com.google.devtools.ksp", version = "2.3.12" }
# T09: static analysis and formatting, both pinned so a build never silently changes rules.
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
