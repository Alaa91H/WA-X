name: Temporary Spotless remediation

on:
  push:
    branches:
      - settings-readiness-audit

concurrency:
  group: spotless-remediation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Generate registry and apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 tools/settings/generate_target_registry.py
          ./gradlew --no-daemon :app:spotlessApply

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "WA X CI"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git commit -m "Apply canonical Spotless formatting"
          git push origin HEAD:settings-readiness-audit
