":"findFirstClassUsingStrings","line":1177,"anchor":"app/time server update processed"},{"fn":"findFirstClassUsingStrings","line":1511,"anchor":"ContactStatusDataItem"},{"fn":"findFirstClassUsingStrings","line":1520,"anchor":"StatusListUpdates"},{"fn":"findFirstClassUsingStrings","line":1529,"anchor":"android:menu:presenters"},{"fn":"findFirstClassUsingStrings","line":1538,"anchor":"hasNewsletterSubscriptions"},{"fn":"findFirstClassUsingStrings","line":1747,"anchor":"frame_visibility_serial_worker"},{"fn":"findFirstClassUsingStrings","line":1979,"anchor":"statusTilesEnabled"},{"fn":"findFirstClassUsingStrings","line":1988,"anchor":"isMuteIndicatorEnabled"},{"fn":"findFirstClassUsingStrings","line":2016,"anchor":"not recyclable"},{"fn":"findFirstClassUsingStrings","line":2051,"anchor":"sendmethods/sendClearDirty"},{"fn":"findFirstClassUsingStrings","line":2251,"anchor":"TranscriptionSegment("},{"fn":"findFirstClassUsingStrings","line":2314,"anchor":"mFragmentId=#"},{"fn":"findFirstClassUsingStrings","line":2466,"anchor":"problematic contact:"},{"fn":"findFirstClassUsingStrings","line":2548,"anchor":"memanager/setMe"},{"fn":"findFirstClassUsingStrings","line":2714,"anchor":"Chatscache/"},{"fn":"findFirstClassUsingStrings","line":2788,"anchor":"WaContactData"},{"fn":"findFirstClassUsingStrings","line":2942,"anchor":"MediaDataVideoConfiguration("},{"fn":"findFirstClassUsingStrings","line":2982,"anchor":"ProfilePhotoManager/sendGetProfilePhoto"},{"fn":"findFirstClassUsingStrings","line":2994,"anchor":"DialerProfilePictureLoader/syncFetchProfilePhoto/onPhotoReceived"},{"fn":"findFirstClassUsingStrings","line":3006,"anchor":"BottomBarConfig("},{"fn":"findFirstClassUsingStrings","line":3038,"anchor":"FStatus state"},{"fn":"findFirstClassUsingStrings","line":3047,"anchor":"RevokeStatusManager/failed"},{"fn":"findFirstClassUsingStrings","line":3087,"anchor":"replyContainer"},{"fn":"findFirstClassUsingStrings","line":3087,"anchor":"bottomSheet"},{"fn":"findFirstClassUsingStrings","line":3087,"anchor":"contentSheet"},{"fn":"findFirstClassUsingStrings","line":3122,"anchor":"KeyValue{key="},{"fn":"findFirstClassUsingStrings","line":3157,"anchor":"FStatusMedia/mediaDataV2"},{"fn":"findFirstClassUsingStrings","line":3249,"anchor":"BubbleRelativeLayout/ConversationRowText"},{"fn":"addUsingString","line":256,"anchor":"receipt"},{"fn":"addUsingString","line":282,"anchor":"ReadReceiptUtils/buildReadReceiptHandler malformed"},{"fn":"addUsingString","line":301,"anchor":"chatInfo/incrementUnseenImportantMessageCount"},{"fn":"addUsingString","line":327,"anchor":"UPDATE_MESSAGE_MAIN_BROADCAST_SCAN_SQL"},{"fn":"addUsingString","line":694,"anchor":"INSERT_VIEW_ONCE_SQL"},{"fn":"addUsingString","line":847,"anchor":"Key"},{"fn":"addUsingString","line":900,"anchor":"playbackFragment/refreshCurrentPageSubTitle message is empty"},{"fn":"addUsingString","line":1081,"anchor":"app/send-presence-subscription jid="},{"fn":"addUsingString","line":1405,"anchor":"Instantiated fragment"},{"fn":"addUsingString","line":1465,"anchor":"UpdatesViewModel/"},{"fn":"addUsingString","line":1483,"anchor":"UpdatesViewModel/Scheduled updates list refresh"},{"fn":"addUsingString","line":1554,"anchor":"CONTACTS_FILTER"},{"fn":"addUsingString","line":1668,"anchor":"saveGroupParticipants/INSERT_GROUP_PARTICIPANT_USER"},{"fn":"addUsingString","line":1698,"anchor":"startup_migrated_version"},{"fn":"addUsingString","line":1731,"anchor":"expire_timestamp"},{"fn":"addUsingString","line":1732,"anchor":"ephemeral_initiated_by_me"},{"fn":"addUsingString","line":1733,"anchor":"ephemeral_trigger"},{"fn":"addUsingString","line":1829,"anchor":"playMiddleTone"},{"fn":"addUsingString","line":1844,"anchor":"INSERT_RECEIPT_USER"},{"fn":"addUsingString","line":1967,"anchor":"Running diff util, updates list size"},{"fn":"addUsingString","line":2127,"anchor":"conversation/refresh"},{"fn":"addUsingString","line":2149,"anchor":"Unreachable code: direction="},{"fn":"addUsingString","line":2325,"anchor":"enable_media_quality_tool"},{"fn":"addUsingString","line":2332,"anchor":"show_media_quality_toggle"},{"fn":"addUsingString","line":2394,"anchor":"StatusData("},{"fn":"addUsingString","line":2669,"anchor":"LastMessageStore/getLastMessagesForNotificationAfterReply"},{"fn":"addUsingString","line":2682,"anchor":"conversationsmgr/replacecontact"},{"fn":"addUsingString","line":2761,"anchor":"ContactManagerDatabase/updateContactWAName"},{"fn":"addUsingString","line":2798,"anchor":"ContactManagerDatabase/updateGroupInfo"},{"fn":"addUsingString","line":2970,"anchor":"ProcessImageQuality("},{"fn":"addUsingString","line":3026,"anchor":"Key(id="},{"fn":"addUsingString","line":3027,"anchor":"senderJid"},{"fn":"usingStrings","line":335,"anchor":"participant_hash"},{"fn":"usingStrings","line":335,"anchor":"view_mode"},{"fn":"usingStrings","line":335,"anchor":"broadcast"},{"fn":"usingStrings","line":343,"anchor":"received_timestamp"},{"fn":"usingStrings","line":343,"anchor":"message"},{"fn":"usingStrings","line":939,"anchor":"SendE2EMessageJob/onRun"},{"fn":"usingStrings","line":1243,"anchor":"INSERT_TABLE_MESSAGE_QUOTED"},{"fn":"usingStrings","line":1888,"anchor":"audio/ogg; codecs=opu"},{"fn":"usingStrings","line":1943,"anchor":"FbHeroAudioPlayer/setPlaybackSpeed"},{"fn":"usingStrings","line":1947,"anchor":"setPlaybackSpeed"},{"fn":"usingStrings","line":2572,"anchor":"is_wfal_paused"},{"fn":"usingStrings","line":2749,"anchor":"MediaTranscode/Starting"},{"fn":"usingStrings","line":3220,"anchor":"MultiSelectionLimitInfo"},{"fn":"usingStrings","line":3236,"anchor":"ConnectionWriter/sendReadReceipts"},{"fn":"usingStrings","line":3263,"anchor":"TextData;"},{"fn":"usingStrings","line":3375,"anchor":"ProfilePhotoManager/sendGetSubProfilePhoto"},{"fn":"usingStrings","line":3387,"anchor":"MessageSelectionDropDownRecyclerView"},{"fn":"usingStrings","line":3409,"anchor":"playbackFragment/setPageActive no-messages "}]''')
          alternatives = json.loads(r'''[["forward-action",["UserActions/userActionForwardMessage","UserActionsMessageForwarding/userActionForwardMessage"]],["archive",["archive/set-content-indicator-to-empty","archive/Unsupported mode in ArchivePreviewView:"]],["revoke",["msgstore/edit/revoke","msgstore/revoking/"]]]''')
          blobs = [p.read_bytes() for p in sorted(Path("whatsapp-dex").glob("*.dex"))]

          def present(text):
              needle = text.encode("utf-8")
              return any(needle in blob for blob in blobs)

          missing = []
          for item in records:
              if present(item["anchor"]):
                  print(f'FOUND L{item["line"]} {item["fn"]}: {item["anchor"]}')
              else:
                  missing.append(item)
                  print(f'::error::MISSING L{item["line"]} {item["fn"]}: {item["anchor"]}')

          missing_groups = []
          for name, choices in alternatives:
              hits = [x for x in choices if present(x)]
              if hits:
                  print(f'FOUND fallback {name}: {hits[0]}')
              else:
                  missing_groups.append((name, choices))
                  print(f'::error::MISSING fallback {name}: {" OR ".join(choices)}')

          print(f'checked_required_anchors={len(records)}')
          print(f'missing_required_anchors={len(missing)}')
          print(f'missing_fallback_groups={len(missing_groups)}')
          if missing or missing_groups:
              raise SystemExit(1)
          PY
          python3 /tmp/check_anchors.py
