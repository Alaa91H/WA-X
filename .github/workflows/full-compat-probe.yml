name: Full WhatsApp DexKit Probe

on:
  push:
    branches:
      - "compat/whatsapp-2.26.32.84-clean"

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Download current official WhatsApp APK
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent "Mozilla/5.0" \
            --output WhatsApp.apk \
            "https://www.whatsapp.com/android/current/WhatsApp.apk"
          test -s WhatsApp.apk
          sha256sum WhatsApp.apk

      - name: Verify official package/version
        run: |
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n 1)"
          APP_ID="$("$APKANALYZER" manifest application-id WhatsApp.apk)"
          VERSION="$("$APKANALYZER" manifest version-name WhatsApp.apk)"
          echo "applicationId=$APP_ID"
          echo "versionName=$VERSION"
          test "$APP_ID" = "com.whatsapp"
          test "$VERSION" = "2.26.39.71"

      - name: Extract DEX
        run: |
          mkdir -p whatsapp-dex
          while IFS= read -r dex; do
            unzip -p WhatsApp.apk "$dex" > "whatsapp-dex/$(basename "$dex")"
          done < <(unzip -Z1 WhatsApp.apk | grep -E '^classes([0-9]+)?\.dex$')
          test "$(find whatsapp-dex -name '*.dex' | wc -l)" -gt 0

      - name: Check all extracted Unobfuscator anchors
        run: |
          cat > /tmp/check_anchors.py <<'PY'
          import json
          from pathlib import Path

          records = json.loads(r'''[{"fn":"findFirstMethodUsingStrings","line":204,"anchor":"presencestatemanager/setAvailable/new-state"},{"fn":"findFirstMethodUsingStrings","line":217,"anchor":"HandleMeComposing/sendComposing"},{"fn":"findFirstMethodUsingStrings","line":234,"anchor":"SharedMessageProcessor/handlePlaintext"},{"fn":"findFirstMethodUsingStrings","line":540,"anchor":"required free space should be > 0"},{"fn":"findFirstMethodUsingStrings","line":553,"anchor":"Tried to set badge for invalid"},{"fn":"findFirstMethodUsingStrings","line":641,"anchor":"MessageHandler/start"},{"fn":"findFirstMethodUsingStrings","line":764,"anchor":"Unknown BooleanField"},{"fn":"findFirstMethodUsingStrings","line":773,"anchor":"Unknown IntField"},{"fn":"findFirstMethodUsingStrings","line":984,"anchor":"voip/callStateChangedOnUIThread"},{"fn":"findFirstMethodUsingStrings","line":997,"anchor":"ConversationViewFiller/setParentGroupProfilePhoto"},{"fn":"findFirstMethodUsingStrings","line":1107,"anchor":"getPinnedJids/QUERY_CHAT_SETTINGS"},{"fn":"findFirstMethodUsingStrings","line":1151,"anchor":"PLAYBACK_PAGE_ITEM_ON_CREATE_VIEW_END"},{"fn":"findFirstMethodUsingStrings","line":1164,"anchor":"StatusPlaybackPage/onViewCreated"},{"fn":"findFirstMethodUsingStrings","line":1227,"anchor":"dialog/delete no messages"},{"fn":"findFirstMethodUsingStrings","line":1227,"anchor":"pref_delete_media"},{"fn":"findFirstMethodUsingStrings","line":1264,"anchor":"FMessageUtil/getOriginalMessageKeyIfEdited"},{"fn":"findFirstMethodUsingStrings","line":1277,"anchor":"MessageEditInfoStore/insertEditInfo/missing"},{"fn":"findFirstMethodUsingStrings","line":1339,"anchor":"CoreMessageStore/updateCheckoutMessageWithTransactionInfo"},{"fn":"findFirstMethodUsingStrings","line":1345,"anchor":"UPDATE_MESSAGE_ADD_ON_FLAGS_MAIN_SQL"},{"fn":"findFirstMethodUsingStrings","line":1418,"anchor":"Maximum number of items supported by"},{"fn":"findFirstMethodUsingStrings","line":1651,"anchor":"lid_me"},{"fn":"findFirstMethodUsingStrings","line":1651,"anchor":"status_me"},{"fn":"findFirstMethodUsingStrings","line":1651,"anchor":"s.whatsapp.net"},{"fn":"findFirstMethodUsingStrings","line":1710,"anchor":"MessageHandler/handleConnectionThreadReady connectionready"},{"fn":"findFirstMethodUsingStrings","line":1716,"anchor":"app/xmpp/recv/handle_available"},{"fn":"findFirstMethodUsingStrings","line":1814,"anchor":"playbackPage/onPlaybackContentFinished"},{"fn":"findFirstMethodUsingStrings","line":1920,"anchor":"forwardable"},{"fn":"findFirstMethodUsingStrings","line":1920,"anchor":"FMessageFactory/newFMessageForForward/thumbnail"},{"fn":"findFirstMethodUsingStrings","line":1927,"anchor":"Non-forwardable message("},{"fn":"findFirstMethodUsingStrings","line":2025,"anchor":"this was called before onCreateView()"},{"fn":"findFirstMethodUsingStrings","line":2038,"anchor":"conversation/copymessage"},{"fn":"findFirstMethodUsingStrings","line":2086,"anchor":"mediaHash and fileType not both present for upload URL generation"},{"fn":"findFirstMethodUsingStrings","line":2205,"anchor":"Android SDK built for x86"},{"fn":"findFirstMethodUsingStrings","line":2218,"anchor":"cyanogen"},{"fn":"findFirstMethodUsingStrings","line":2227,"anchor":"transcribe: starting transcription"},{"fn":"findFirstMethodUsingStrings","line":2239,"anchor":"Unsupported language"},{"fn":"findFirstMethodUsingStrings","line":2263,"anchor":"presencestatemanager/startTransitionToUnavailable/new-state"},{"fn":"findFirstMethodUsingStrings","line":2275,"anchor":"CachedMessageStore/getMessage/key"},{"fn":"findFirstMethodUsingStrings","line":2382,"anchor":"GET_RECEIVED_TOKEN_AND_TIMESTAMP_BY_JID"},{"fn":"findFirstMethodUsingStrings","line":2524,"anchor":"WaJidMapRepository/getPhoneJidByAccountUserJid"},{"fn":"findFirstMethodUsingStrings","line":2536,"anchor":"WaJidMapRepository/getAccountUserJidByPhoneJid"},{"fn":"findFirstMethodUsingStrings","line":2557,"anchor":"search_bar_render_start"},{"fn":"findFirstMethodUsingStrings","line":2701