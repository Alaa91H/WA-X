name: Release Compile Probe

on:
  push:
    branches:
      - "compat/whatsapp-2.26.32.84-clean"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testWhatsappDebugUnitTest testBusinessDebugUnitTest

      - name: Compile unsigned release variants
        run: ./gradlew assembleWhatsappRelease assembleBusinessRelease
