name: Release

on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Get version and SHA
        id: vars
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -n 's/.*versionName = "\([^ ]*\).*/\1/p')
          SHA8=$(git rev-parse --short=8 HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION-$SHA8" >> $GITHUB_OUTPUT

      - name: Write signing key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_STORE" ] || [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are incomplete"
            exit 1
          fi
          printf '%s\n' "androidStorePassword=$KEY_STORE_PASSWORD" >> gradle.properties
          printf '%s\n' "androidKeyAlias=$KEY_ALIAS" >> gradle.properties
          printf '%s\n' "androidKeyPassword=$KEY_PASSWORD" >> gradle.properties
          printf '%s\n' "androidStoreFile=key.jks" >> gradle.properties
          printf '%s' "$KEY_STORE" | base64 --decode > key.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all release variants
        run: ./gradlew assembleWhatsappRelease assembleBusinessRelease

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: WaEnhancer ${{ steps.vars.outputs.version }}
          body_path: changelog.txt
          files: |
            app/build/outputs/apk/whatsapp/release/WaEnhancer*.apk
            app/build/outputs/apk/business/release/WaEnhancer-Business*.apk
          tag_name: ${{ steps.vars.outputs.tag }}

      - name: Read changelog
        id: changelog
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('changelog.txt', 'utf8').trim();
            core.setOutput('content', changelog);

      - name: Post to Telegram channel
        if: ${{ env.BOT_TOKEN != '' }}
        uses: Dev4Mod/telegram-github-action@e1001298507b8e281cb05254f450b920871ecc85
        with:
          to: ${{ env.CHANNEL_ID }}
          token: ${{ env.BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            ${{ steps.changelog.outputs.content }}

            Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.tag }}
