name: Android CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: waenhancer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build, test, lint & sign
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^waeVersionName=//p' gradle.properties | tail -n 1 | tr -d '\r')"
          VERSION_CODE="$(sed -n 's/^waeVersionCode=//p' gradle.properties | tail -n 1 | tr -d '\r')"
          EXPECTED_TAG="v$VERSION"

          if [[ -z "$VERSION" || -z "$VERSION_CODE" ]]; then
            echo "::error::waeVersionName/waeVersionCode are missing from gradle.properties"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version: $VERSION"
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Android version code: $VERSION_CODE"
            exit 1
          fi

          IS_TAG=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            IS_TAG=true
            EVENT_TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$EVENT_TAG" != "$EXPECTED_TAG" ]]; then
              echo "::error::Tag $EVENT_TAG does not match configured version $EXPECTED_TAG"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (code $VERSION_CODE); release tag: $EXPECTED_TAG; tag run: $IS_TAG"

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Build debug variants and run unit tests
        run: |
          ./gradlew --no-daemon --stacktrace \
            assembleWhatsappDebug \
            assembleBusinessDebug \
            testWhatsappDebugUnitTest \
            testBusinessDebugUnitTest

      - name: Run Android lint
        run: |
          ./gradlew --no-daemon --stacktrace --continue \
            lintWhatsappDebug \
            lintBusinessDebug

      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEY_STORE KEY_STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done

          printf '%s\n' "androidStorePassword=$KEY_STORE_PASSWORD" >> gradle.properties
          printf '%s\n' "androidKeyAlias=$KEY_ALIAS" >> gradle.properties
          printf '%s\n' "androidKeyPassword=$KEY_PASSWORD" >> gradle.properties
          printf '%s\n' "androidStoreFile=key.jks" >> gradle.properties
          printf '%s' "$KEY_STORE" | base64 --decode > key.jks

      - name: Build signed APKs
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_TAG: ${{ steps.version.outputs.is_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$IS_TAG" == "true" ]]; then
            ./gradlew --no-daemon --stacktrace clean \
              assembleWhatsappRelease \
              assembleBusinessRelease \
              -PreleaseTag="$RELEASE_TAG"
          else
            ./gradlew --no-daemon --stacktrace clean \
              assembleWhatsappRelease \
              assembleBusinessRelease
          fi

          mkdir -p signed-apks
          mapfile -t WA_APKS < <(find app/build/outputs/apk/whatsapp/release -maxdepth 1 -type f -name '*.apk' | sort)
          mapfile -t WB_APKS < <(find app/build/outputs/apk/business/release -maxdepth 1 -type f -name '*.apk' | sort)

          if [[ "${#WA_APKS[@]}" -ne 1 || "${#WB_APKS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release APK for each flavor"
            printf 'WhatsApp APKs: %s\n' "${WA_APKS[*]:-none}"
            printf 'Business APKs: %s\n' "${WB_APKS[*]:-none}"
            exit 1
          fi

          if [[ "$IS_TAG" == "true" ]]; then
            WA_NAME="WaEnhancer-$VERSION.apk"
            WB_NAME="WaEnhancer-Business-$VERSION.apk"
          else
            SHA8="${GITHUB_SHA:0:8}"
            WA_NAME="WaEnhancer-$VERSION-ci-$SHA8.apk"
            WB_NAME="WaEnhancer-Business-$VERSION-ci-$SHA8.apk"
          fi

          cp "${WA_APKS[0]}" "signed-apks/$WA_NAME"
          cp "${WB_APKS[0]}" "signed-apks/$WB_NAME"

          if find signed-apks -maxdepth 1 -type f ! -name '*.apk' -print -quit | grep -q .; then
            echo "::error::Signed APK staging contains a non-APK file"
            exit 1
          fi

      - name: Verify APK signatures
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found"
            exit 1
          fi
          for apk in signed-apks/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Upload signed APK build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-apks-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: signed-apks/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release from tag
        if: steps.version.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

          gh release create "$TAG" signed-apks/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "WaEnhancer $VERSION" \
            --notes-file changelog.txt \
            --verify-tag

  create-tag:
    name: Create requested release tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'release: v')
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate request and push tag
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^waeVersionName=//p' gradle.properties | tail -n 1 | tr -d '\r')"
          TAG="v$VERSION"
          FIRST_LINE="${COMMIT_MESSAGE%%$'\n'*}"

          if [[ "$FIRST_LINE" != "release: $TAG" ]]; then
            echo "::error::Release commit must be exactly: release: $TAG"
            exit 1
          fi

          REMOTE_MASTER_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [[ "$REMOTE_MASTER_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Refusing to tag a superseded master commit"
            exit 1
          fi

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG already points to $EXISTING_SHA"
              exit 1
            fi
            echo "$TAG already exists on this commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "WaEnhancer $TAG"
          git push origin "$TAG"
