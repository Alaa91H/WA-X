# =============================================================================
# WA X — Android CI (single source of truth for building and releasing)
# =============================================================================
#
# This is the ONLY workflow in the repository. It owns the whole pipeline:
# preflight, parallel compile/static/unit/runtime gates, release-only E2E,
# privileged APK signing after the strict verdict, signature/manifest verification,
# SBOM + provenance attestations, GitHub Release publishing, and Telegram delivery.
#
# Event matrix
#   pull_request      Verify only. Builds/tests the debug variant, imports no
#                     production signing material, and publishes nothing.
#   push to main      Runs parallel strict gates, then builds an optimized
#                     release-type Beta APK signed only after the strict verdict,
#                     uploads it as an artifact and posts it to Beta Testing.
#   push of tag v*    Builds the optimized release variant with the same WA X
#                     update key, validates it, creates the GitHub Release,
#                     then publishes it to Updates & Releases.
#   workflow_dispatch Same as a main push, or the release path when dispatched
#                     on an existing tag.
#   schedule          Ubuntu 26.04 compatibility canary only; never signs or publishes.
#
# Release contract (enforced, not documented-only)
#   * The tag, the configured version and the version baked into the APK are
#     all the same string. Any mismatch fails the run.
#     gradle.properties -> waxVersionName == <tag> without the leading "v"
#     APK versionName   == waxVersionName
#     APK versionCode   == waxVersionCode
#   * Every APK distributed to users (Beta or tagged Release) is signed with
#     the same WA X update key. Pull requests never receive signing secrets.
#     This keeps Android updates signature-compatible across Beta and Stable.
#   * Distributed Beta APKs use the optimized release build type (R8 enabled),
#     but keep a development versionName and a commit-qualified filename.
#   * A GitHub Release is created only from a tag, never from a branch push.
#   * The release payload is exactly one .apk file. The staging directory is
#     rejected if it holds any other file type or unexpected APK.
#   * Release notes come from changelog.txt, which must be present and must
#     name the released version.
#
# Actions are pinned to commit SHAs so the pipeline cannot be changed from a
# pull request or by a compromised tag.
# =============================================================================

name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - ci/telegram-release-publisher-test
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_telegram:
        description: Publish the validated APK to Telegram
        required: true
        default: true
        type: boolean
      force_publish:
        description: Ignore an existing Telegram publication marker for this commit/channel
        required: true
        default: false
        type: boolean

  # Weekly forward-compatibility canary. Scheduled workflows execute from the
  # default branch; production jobs explicitly skip this event.
  schedule:
    - cron: '17 4 * * 1'

# Superseded runs on a branch are pointless, so they are cancelled. A release
# run must never be cancelled halfway through.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  GRADLE_ARGS: --no-daemon --stacktrace
  # Explicit APK growth budget for the regression gate. The 1.7.0 platform and
  # resolver work grew the debug APK by ~3.0%. The budget is a reviewed number,
  # not a default: lower it as the baseline is paid down, and raise it only with
  # a reason recorded in the pull request.
  MAX_APK_GROWTH_PCT: '4.0'

jobs:
  preflight:
    name: Preflight and release contract
    if: github.event_name != 'schedule'
    runs-on: &stable_runner ubuntu-24.04
    timeout-minutes: 10
    cache-mode: none
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.is_tag }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - &checkout_full
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      # The single point where the tag, the configured version and the release
      # decision are derived. Every later step reads these outputs instead of
      # re-deriving them, so the pipeline cannot disagree with itself.
      - name: Resolve version and validate the tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          property() {
            local value
            value="$(sed -n "s/^$1=//p" gradle.properties | tail -n 1 | tr -d '\r')"
            if [[ -z "$value" ]]; then
              echo "::error::$1 is missing from gradle.properties"
              exit 1
            fi
            echo "$value"
          }

          VERSION="$(property waxVersionName)"
          VERSION_CODE="$(property waxVersionCode)"
          TAG="v$VERSION"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::waxVersionName is not a release version: $VERSION"
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::waxVersionCode is not an integer: $VERSION_CODE"
            exit 1
          fi

          IS_TAG=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            IS_TAG=true
            EVENT_TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$EVENT_TAG" != "$TAG" ]]; then
              echo "::error::Tag $EVENT_TAG does not match the configured version $TAG"
              exit 1
            fi
            if gh release view "$EVENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Release $EVENT_TAG already exists; bump the version instead of reusing it"
              exit 1
            fi
          fi

          SHA8="${GITHUB_SHA:0:8}"
          if [[ "$IS_TAG" == "true" ]]; then
            ARTIFACT="apk-$VERSION-$SHA8"
          else
            ARTIFACT="apk-$VERSION-beta-$SHA8"
          fi

          {
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "tag=$TAG"
            echo "is_tag=$IS_TAG"
            echo "artifact_name=$ARTIFACT"
          } >> "$GITHUB_OUTPUT"

          echo "### Version resolution" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`$VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version code | \`$VERSION_CODE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release tag | \`$TAG\` |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$IS_TAG" == true ]]; then
            MODE="stable release"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            MODE="PR verification"
          elif [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "ci/telegram-release-publisher-test" ]]; then
            MODE="signed optimized beta"
          else
            MODE="CI verification"
          fi
          echo "| Mode | $MODE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA:0:8}\` |" >> "$GITHUB_STEP_SUMMARY"
  build:
    name: Compile debug APK
    if: needs.preflight.result == 'success'
    needs: preflight
    runs-on: *stable_runner
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - *checkout_full
      - &setup_java
        name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          verify-signature: true
      - &setup_gradle
        name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
          cache-cleanup: on-success
          add-job-summary: on-failure
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      - name: Compile the debug APK
        run: ./gradlew $GRADLE_ARGS assembleDebug :modern-runtime:testDebugUnitTest

      # The declaration-level LSPosed contract check runs in strict-static and only reads
      # gradle/libs.versions.toml, so it works on a cold checkout. This one opens the artifact
      # this job just resolved and asserts it publishes every legacy type the module imports,
      # which is the only way to prove the pin and the code agree. It lives here because this is
      # the only job that has the jar, and it fails rather than skipping when the jar is absent:
      # a step that can report "nothing to check" is exactly how the version-blind checker it
      # replaced survived for as long as it did.
      - name: Prove the pinned legacy API artifact matches the code
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(
            find "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1/de.robv.android.xposed" \
              -type f -name 'api-*.jar' ! -name '*-sources.jar' | sort | tail -n 1
          )"
          if [[ -z "$JAR" ]]; then
            echo "::error::The resolved de.robv.android.xposed:api artifact was not found in the Gradle cache"
            exit 1
          fi
          python3 tools/quality/check_lsposed_contract.py --verify-artifact --artifact "$JAR"

      # The artifact-level half of the loader contract, on the build this job actually produced:
      # the class named in the APK's own assets/xposed_init must be a class definition in its dex.
      # This is the debug variant, which is not shrunk, so it cannot catch a keep-rule mistake -
      # that is what the release step checks. What it does catch is the other silent failure: an
      # entry point renamed, moved or mistyped so that the file and the code no longer agree.
      - name: Prove the built APK declares an entry point it actually contains
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "::error::assembleDebug produced no APK to verify"
            exit 1
          fi
          python3 tools/quality/check_apk_loader_contract.py --apk "$APK"

      - name: Compile and verify separate API 102 canary APK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/quality/test_check_modern_canary_apk.py
          python3 tools/quality/check_modern_canary_apk.py --source-only
          # The canary module is explicitly absent from the regular release graph.
          ./gradlew $GRADLE_ARGS -PenableModernCanary=true :modern-canary:assembleDebug :modern-canary:assembleRelease :modern-canary:lintDebug
          CANARY_APK="$(find modern-canary/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          CANARY_RELEASE="$(find modern-canary/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "$CANARY_APK" && test -n "$CANARY_RELEASE"
          python3 tools/quality/check_modern_canary_apk.py --apk "$CANARY_APK"
          python3 tools/quality/check_modern_canary_apk.py --apk "$CANARY_RELEASE"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$SIGNER"
          "$SIGNER" verify --verbose "$CANARY_APK"

      - name: Upload separate modern API 102 canary debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modern-api102-canary-${{ github.sha }}
          path: modern-canary/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 5
      - name: Upload baseline APK input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-apk-${{ github.sha }}
          path: app/build/outputs/apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  strict-static:
    name: Strict parallel static quality
    if: needs.preflight.result == 'success'
    needs: preflight
    runs-on: *stable_runner
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - *checkout_full
      - *setup_java
      - *setup_gradle
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      # GitHub Actions supports native parallel step groups. Independent source-only
      # contracts run concurrently while retaining isolated logs and one final wait.
      - parallel:
          - name: Gradle formatting, detekt and lint
            shell: bash
            run: |
              set -euo pipefail
              mkdir -p build/strict-quality/static
              exec > >(tee build/strict-quality/static/gradle-static.log) 2>&1
              ./gradlew --no-daemon --stacktrace --continue --warning-mode=fail spotlessCheck detekt lintDebug
          - name: Compatibility contracts
            shell: bash
            run: |
              set -uo pipefail
              mkdir -p build/strict-quality/static
              exec > >(tee build/strict-quality/static/compatibility.log) 2>&1
              failures=0
              python3 tools/compatibility/test_validator.py || failures=$((failures + 1))
              python3 tools/compatibility/validate_compatibility.py || failures=$((failures + 1))
              python3 tools/compatibility/sync_generated.py --check || failures=$((failures + 1))
              [[ "$failures" -eq 0 ]]
          - name: Settings and UI contracts
            shell: bash
            run: |
              set -uo pipefail
              mkdir -p build/strict-quality/static
              exec > >(tee build/strict-quality/static/settings-ui.log) 2>&1
              failures=0
              python3 tools/settings/generate_target_registry.py --check || failures=$((failures + 1))
              python3 tools/quality/check_preference_wiring.py || failures=$((failures + 1))
              python3 tools/quality/check_preference_types.py || failures=$((failures + 1))
              python3 tools/quality/strict/check_ui_surface.py || failures=$((failures + 1))
              [[ "$failures" -eq 0 ]]
          - name: Access, LSPosed and repository contracts
            shell: bash
            run: |
              set -uo pipefail
              mkdir -p build/strict-quality/static
              exec > >(tee build/strict-quality/static/runtime-contracts.log) 2>&1
              failures=0
              python3 tools/quality/test_scan_access_gates.py || failures=$((failures + 1))
              python3 tools/quality/scan_access_gates.py --check-mirror || failures=$((failures + 1))
              python3 tools/quality/test_check_lsposed_contract.py || failures=$((failures + 1))
              python3 tools/quality/check_lsposed_contract.py || failures=$((failures + 1))
              python3 tools/quality/check_modern_bridge_contract.py || failures=$((failures + 1))
              python3 tools/quality/check_modern_canary_apk.py --source-only || failures=$((failures + 1))
              python3 tools/quality/test_check_modern_canary_apk.py || failures=$((failures + 1))
              # The keep rule is what holds the entry point against R8, which never reads
              # assets/xposed_init. The source-level checker above asserts the rule exists; the
              # artifact-level check that reads a built APK runs in the build and release steps,
              # because a gate that only reads the tree is how the entry point was lost.
              python3 tools/quality/test_check_apk_loader_contract.py || failures=$((failures + 1))
              python3 tools/quality/test_check_repository_urls.py || failures=$((failures + 1))
              python3 tools/quality/check_repository_urls.py || failures=$((failures + 1))
              # The feature-contract boundary. A platform type in a feature constructor compiles
              # fine and fails on a device, so the rule that keeps com.wax.module.contract free of
              # Android, Xposed and DexKit has to be a gate rather than a convention. The self-test
              # runs first for the same reason as every other one here: a checker whose own regexes
              # quietly stopped matching reports a clean tree that is not clean.
              python3 tools/quality/test_check_feature_contracts.py || failures=$((failures + 1))
              python3 tools/quality/check_feature_contracts.py || failures=$((failures + 1))
              # The A02 ratchet. Mutable global state in the injected process is meant to shrink, so
              # the gate counts write *sites* rather than state: deleting one writer and adding
              # another leaves a count unchanged while the module has got worse. Owners are keyed by
              # file in tools/quality/legacy_global_writes.json, and a writer leaving that list is
              # progress, not a failure.
              python3 tools/quality/test_check_legacy_global_writes.py || failures=$((failures + 1))
              python3 tools/quality/check_legacy_global_writes.py || failures=$((failures + 1))
              # One registration source for the module's features. The runtime used to install from a
              # hand-maintained array while the compatibility matrix was computed from a second list,
              # and nothing compared them: a feature registered in one and not the other would have
              # shipped a module whose behaviour the matrix does not describe.
              python3 tools/quality/test_check_feature_registry.py || failures=$((failures + 1))
              python3 tools/quality/check_feature_registry.py || failures=$((failures + 1))
              [[ "$failures" -eq 0 ]]
          - name: Modernization evidence contracts
            shell: bash
            run: |
              set -uo pipefail
              mkdir -p build/strict-quality/static
              exec > >(tee build/strict-quality/static/modernization.log) 2>&1
              failures=0
              # The M00 evidence lock. It re-derives the recorded toolchain, loader contract,
              # source counts and workflow hashes from the tree and fails when the committed copy
              # no longer matches. Every field is derived on purpose, so a failure here means
              # something real moved; note that editing this workflow changes its own recorded
              # hash, so the fix is to re-run with --write and commit both rather than relax it.
              python3 tools/modernization/test_collect_m00_baseline.py || failures=$((failures + 1))
              python3 tools/modernization/collect_m00_baseline.py --check || failures=$((failures + 1))
              # The runtime-surface inventory: the counts M01-M13 size their work against, so a
              # later phase can tell whether it finished. The self-test runs first because an
              # inventory whose regexes quietly stopped matching reads exactly like a codebase
              # that stopped using the thing.
              python3 tools/modernization/test_inventory_runtime_surface.py || failures=$((failures + 1))
              python3 tools/modernization/inventory_runtime_surface.py --check || failures=$((failures + 1))
              # The release/device test matrix: Android level, LSPosed build, WhatsApp train and
              # the nine lifecycle scenarios. Separate from the feature x WhatsApp-version matrix
              # because it answers a different question. Every cell starts unverified, so today
              # the only thing it proves is that nothing claims support it has not earned.
              python3 tools/modernization/test_validate_test_matrix.py || failures=$((failures + 1))
              python3 tools/modernization/validate_test_matrix.py --check || failures=$((failures + 1))
              # The A00 architecture law. Every forbidden edge carries a limit measured from the
              # tree rather than typed, so the gate fails when a count rises and says which phase
              # owns removing it when it does. The self-test runs first for the same reason as
              # every other one here: during A00 two rules reported zero against 58 and 64
              # violating files, because their scopes matched no real layer.
              python3 tools/architecture/test_check_architecture.py || failures=$((failures + 1))
              python3 tools/architecture/check_architecture.py --check || failures=$((failures + 1))
              [[ "$failures" -eq 0 ]]
      - name: Upload complete static diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-static-${{ github.sha }}
          path: |
            build/strict-quality/
            app/build/reports/
          if-no-files-found: warn
          retention-days: 30
  strict-unit:
    name: Strict unit tests and coverage floor
    if: needs.preflight.result == 'success'
    needs: preflight
    runs-on: *stable_runner
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - *checkout_full
      - *setup_java
      - *setup_gradle
      # The unit-test runner also configures CMake despite executing JVM-only tests. Its
      # ephemeral SDK may lack the pinned NDK, and an occasional CDN error returns a
      # non-ZIP archive. Retry only that exact component instead of weakening coverage.
      - name: Verify pinned NDK with bounded SDK-manager retries
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="$(sed -nE 's/.*ndkVersion = "([0-9.]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "$NDK_VERSION" =~ ^[0-9.]+$ ]]
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [[ -f "$NDK_PATH/source.properties" ]] && grep -Fq "Pkg.Revision = $NDK_VERSION" "$NDK_PATH/source.properties"; then
            echo "Pinned NDK $NDK_VERSION already installed"
            exit 0
          fi
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          for attempt in 1 2 3; do
            echo "Installing pinned NDK $NDK_VERSION (attempt $attempt of 3)"
            if timeout 600 "$SDKMANAGER" --install "ndk;$NDK_VERSION" && \
                [[ -f "$NDK_PATH/source.properties" ]] && \
                grep -Fq "Pkg.Revision = $NDK_VERSION" "$NDK_PATH/source.properties"; then
              exit 0
            fi
            # Hosted runner only; a partial/corrupt install must not poison retries.
            rm -rf "$NDK_PATH"
            sleep $((attempt * 5))
          done
          echo "::error::Pinned NDK $NDK_VERSION could not be installed after 3 attempts"
          exit 1      # Absolute 100% is not reachable for a hooked-process module and is not what this
      # checks. Every counter has a floor in quality/coverage-baseline.json, and a change
      # fails when the covered count falls (a lost test) or the percentage falls (production
      # code added without one). Both guards were verified to fire.
      - name: Execute all unit tests and enforce the coverage floor
        shell: bash
        run: |
          set +e
          mkdir -p build/strict-quality/unit
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --continue --warning-mode=fail \
            -PstrictCollectAll=true \
            :app:createDebugUnitTestCoverageReport
          gradle_rc=$?
          python3 tools/quality/strict/check_junit_results.py \
            --glob 'app/build/test-results/**/*.xml' \
            --suite unit \
            --out build/strict-quality/unit/junit.json
          junit_rc=$?
          unit_xml="$(find app/build/reports/coverage -type f -name '*.xml' 2>/dev/null | sort | head -n 1)"
          python3 tools/quality/strict/check_coverage_floor.py \
            --xml "${unit_xml:-__missing_unit_coverage__.xml}" \
            --suite unit \
            --out build/strict-quality/unit/coverage.json
          coverage_rc=$?
          echo "gradle=$gradle_rc junit=$junit_rc coverage=$coverage_rc"
          [[ "$gradle_rc" -eq 0 && "$junit_rc" -eq 0 && "$coverage_rc" -eq 0 ]]
      - name: Upload baseline unit-test input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-unit-${{ github.sha }}
          path: app/build/test-results/
          if-no-files-found: error
          retention-days: 1
      - name: Upload complete unit diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-unit-${{ github.sha }}
          path: |
            build/strict-quality/
            app/build/test-results/
            app/build/reports/coverage/
          if-no-files-found: warn
          retention-days: 30
  baseline:
    name: Baseline regression fan-in
    if: ${{ needs.build.result == 'success' && needs.strict-unit.result == 'success' }}
    needs:
      - build
      - strict-unit
    runs-on: *stable_runner
    timeout-minutes: 10
    cache-mode: none
    permissions:
      contents: read
      actions: read
    steps:
      - *checkout_full
      - name: Download debug APK baseline input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-apk-${{ github.sha }}
          path: baseline-input/apk
      - name: Download unit-test baseline input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-unit-${{ github.sha }}
          path: baseline-input/unit
      # The reference baseline is taken from the base revision (pull-request base
      # branch, pre-push commit or HEAD^), never from this change's own copy, so a
      # change cannot raise the limits it is measured against by editing
      # baseline.json in the same commit.
      - name: Enforce the baseline regression gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_MAX_APK_GROWTH_PCT: ${{ env.MAX_APK_GROWTH_PCT }}
        run: |
          MAX_APK_GROWTH_PCT="$DEFAULT_MAX_APK_GROWTH_PCT"

          # A deliberate baseline reset is the one case this ratchet cannot express by
          # itself: adopting a UI framework genuinely grows the APK, and the gate is
          # measured against the base revision precisely so a change cannot widen its own
          # limit. It is therefore allowed explicitly, through a committed justification
          # that names the measurement. Its text is echoed into the job summary so a
          # widened limit is never invisible, and deleting the file restores the default.
          JUSTIFICATION=tools/baseline/APK_GROWTH_JUSTIFICATION.md
          if [[ -f "$JUSTIFICATION" ]]; then
            MAX_APK_GROWTH_PCT="$(sed -n 's/^accepted-growth-pct:[[:space:]]*//p' "$JUSTIFICATION" | head -n 1)"
            if [[ ! "$MAX_APK_GROWTH_PCT" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::$JUSTIFICATION has no valid 'accepted-growth-pct:' line"
              exit 1
            fi
            {
              echo "### APK size ratchet widened for this run"
              echo ""
              echo "Limit raised from +$DEFAULT_MAX_APK_GROWTH_PCT% to +$MAX_APK_GROWTH_PCT% by a committed justification:"
              echo ""
              sed 's/^/  /' "$JUSTIFICATION"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          python3 tools/baseline/check_baseline.py \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --pr-base-sha "$PR_BASE_SHA" \
            --before-sha "$BEFORE_SHA" \
            --test-results "baseline-input/unit" \
            --apk-root "baseline-input/apk" \
            --max-apk-growth "$MAX_APK_GROWTH_PCT"
  strict-e2e:
    name: Release-only Android E2E and coverage gate
    if: startsWith(github.ref, 'refs/tags/v') && needs.preflight.result == 'success'
    needs: preflight
    runs-on: *stable_runner
    timeout-minutes: 18
    cache-mode: write
    permissions:
      contents: read
    env:
      STRICT_E2E_API: '35'
    steps:
      - *checkout_full
      - *setup_java
      - name: Set up Gradle for release E2E
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
          cache-read-only: false
          cache-cleanup: on-success
          add-job-summary: on-failure
      # Every infrastructure phase is bounded inside run_strict_e2e.sh and this step has an
      # independent 15-minute ceiling. The E2E floor is not recorded yet, so this
      # run records its measurement instead of failing on a threshold nobody has chosen; it
      # becomes binding the moment someone pins it with --update.
      - name: Run Android instrumentation to completion and enforce the coverage floor
        timeout-minutes: 15
        shell: bash
        run: |
          set +e
          mkdir -p build/strict-quality/e2e
          chmod +x gradlew tools/ci/run_strict_e2e.sh
          tools/ci/run_strict_e2e.sh
          e2e_rc=$?
          # 2 means the runner cannot host an accelerated emulator. That is an infrastructure
          # fact, so it is recorded and surfaced in the job summary rather than failed as if
          # the suite had run and broken.
          if [[ "$e2e_rc" -eq 2 ]]; then
            {
              echo "### Android E2E"
              echo
              echo "- Result: not attempted"
              echo "- Reason: /dev/kvm is unavailable, so this runner cannot host an accelerated emulator."
              echo "- The gate stays binding on a runner that can; see tools/ci/run_strict_e2e.sh."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 tools/quality/strict/check_junit_results.py \
            --glob 'app/build/outputs/androidTest-results/**/*.xml' \
            --suite e2e \
            --out build/strict-quality/e2e/junit.json
          junit_rc=$?
          e2e_xml="$(find app/build/reports/coverage/androidTest -type f -name '*.xml' 2>/dev/null | sort | head -n 1)"
          python3 tools/quality/strict/check_coverage_floor.py \
            --xml "${e2e_xml:-__missing_e2e_coverage__.xml}" \
            --suite e2e \
            --out build/strict-quality/e2e/coverage.json
          coverage_rc=$?
          echo "e2e=$e2e_rc junit=$junit_rc coverage=$coverage_rc"
          [[ "$e2e_rc" -eq 0 && "$junit_rc" -eq 0 && "$coverage_rc" -eq 0 ]]
      - name: Upload complete E2E diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-e2e-${{ github.sha }}
          path: |
            build/strict-quality/
            app/build/outputs/androidTest-results/
            app/build/reports/coverage/
          if-no-files-found: warn
          retention-days: 30
  strict-runtime:
    name: Latest WhatsApp and Business device-lab contract
    if: needs.preflight.result == 'success'
    needs: preflight
    runs-on: *stable_runner
    timeout-minutes: 10
    cache-mode: none
    permissions:
      contents: read
    steps:
      - *checkout_full
      # Binds the target the moment the compatibility matrix claims support for it. Today
      # every cell is `unknown`, which its own statusVocabulary calls the only status
      # permitted without evidence, so there is nothing to prove and this reports the count
      # of claims it found. The self-test runs first, because a conditional gate that cannot
      # reach its condition is a gate that never fails.
      - name: Prove the claim-driven runtime gate can still fail
        run: python3 tools/quality/test_check_latest_runtime_evidence.py
      - name: Require evidence for every support claim on newest target trains
        shell: bash
        run: |
          mkdir -p build/strict-quality/runtime
          python3 tools/quality/strict/check_latest_runtime_evidence.py \
            --commit "$GITHUB_SHA" \
            --out build/strict-quality/runtime/latest-runtime.json
      - name: Upload complete runtime-evidence diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-runtime-${{ github.sha }}
          path: build/strict-quality/
          if-no-files-found: error
          retention-days: 30
  strict-verdict:
    name: Atomic strict quality verdict
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    needs:
      - preflight
      - build
      - baseline
      - strict-static
      - strict-unit
      - strict-e2e
      - strict-runtime
    runs-on: *stable_runner
    timeout-minutes: 5
    cache-mode: none
    steps:
      - name: Fail only after every independent gate has reported
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Atomic strict quality verdict

          | Gate | Result |
          | --- | --- |
          | Preflight / release contract | ${{ needs.preflight.result }} |
          | Compile debug APK | ${{ needs.build.result }} |
          | Baseline regression fan-in | ${{ needs.baseline.result }} |
          | Static quality and source/UI contracts | ${{ needs.strict-static.result }} |
          | Unit tests + coverage floor | ${{ needs.strict-unit.result }} |
          | Android E2E + coverage floor | ${{ needs.strict-e2e.result }} |
          | Runtime evidence for every support claim | ${{ needs.strict-runtime.result }} |
          EOF
          failed=0
          for result in \
            '${{ needs.preflight.result }}' \
            '${{ needs.build.result }}' \
            '${{ needs.baseline.result }}' \
            '${{ needs.strict-static.result }}' \
            '${{ needs.strict-unit.result }}' \
            '${{ needs.strict-runtime.result }}'; do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ '${{ needs.strict-e2e.result }}' != "success" ]]; then
              echo "::error::Tagged releases require the Android E2E gate to succeed."
              failed=1
            fi
          else
            echo "Android E2E skipped by policy: full instrumentation runs only for tagged releases."
          fi

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Strict atomic quality verdict failed. No signing or publishing is permitted."
            exit 1
          fi
  package:
    name: Privileged signed release packaging
    if: >-
      ${{
        !cancelled() &&
        github.event_name != 'pull_request' &&
        github.event_name != 'schedule' &&
        needs.strict-verdict.result == 'success' &&
        (
          startsWith(github.ref, 'refs/tags/v') ||
          github.ref_name == 'main' ||
          github.ref_name == 'ci/telegram-release-publisher-test'
        )
      }}
    needs:
      - preflight
      - strict-verdict
    runs-on: *stable_runner
    timeout-minutes: 45
    cache-mode: read
    permissions:
      contents: read
    steps:
      - *checkout_full
      - *setup_java
      - name: Set up Gradle without privileged cache writes
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
          cache-read-only: true
          add-job-summary: on-failure
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      - name: Import the WA X update keystore
        if: github.event_name != 'pull_request'
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in KEY_STORE KEY_STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done

          printf '%s\n' "androidStorePassword=$KEY_STORE_PASSWORD" >> gradle.properties
          printf '%s\n' "androidKeyAlias=$KEY_ALIAS" >> gradle.properties
          printf '%s\n' "androidKeyPassword=$KEY_PASSWORD" >> gradle.properties
          printf '%s\n' "androidStoreFile=key.jks" >> gradle.properties
          printf '%s' "$KEY_STORE" | base64 --decode > key.jks

          # key.jks is read back here so a truncated or mistyped secret fails
          # before any distributable Beta/Release APK is built.
          if ! keytool -list -keystore key.jks \
              -storepass "$KEY_STORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The WA X update keystore could not be opened with the configured alias"
            exit 1
          fi

          # The certificate fingerprint is public metadata. Carry it forward
          # so every distributed APK can be proven to use this exact update key.
          EXPECTED_SIGNING_CERT_SHA256="$(
            keytool -exportcert \
              -keystore key.jks \
              -storepass "$KEY_STORE_PASSWORD" \
              -alias "$KEY_ALIAS" |
              sha256sum |
              awk '{print toupper($1)}'
          )"
          if [[ ! "$EXPECTED_SIGNING_CERT_SHA256" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Could not derive the WA X signing certificate SHA-256"
            exit 1
          fi
          echo "EXPECTED_SIGNING_CERT_SHA256=$EXPECTED_SIGNING_CERT_SHA256" >> "$GITHUB_ENV"

      # One staging directory, deterministic names, and nothing that is not an
      # APK may enter it. Every user-distributed build uses the optimized release
      # variant and the same WA X update key. Pull requests stay debug-only.
      - name: Build and stage the APKs
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          IS_TAG: ${{ needs.preflight.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          # WA X ships one APK that hooks both WhatsApp builds, so there is exactly
          # one output to stage and one asset to publish. The name is deterministic:
          # the release uses the version alone, a branch run adds the commit so a test
          # build is never mistaken for a release.
          SOURCE_VARIANT=release
          if [[ "$IS_TAG" == "true" ]]; then
            ./gradlew $GRADLE_ARGS clean \
              assembleRelease \
              -PreleaseTag="$RELEASE_TAG"
            APK_NAME="WA-X-v$VERSION.apk"
          else
            # Beta distribution uses the release build type so R8 and release
            # packaging optimizations match Stable. Without releaseTag Gradle
            # deliberately keeps versionName as <base>-dev+<SHA8>.
            ./gradlew $GRADLE_ARGS clean \
              assembleRelease
            SHA8="${GITHUB_SHA:0:8}"
            APK_NAME="WA-X-$VERSION-beta-$SHA8.apk"
          fi

          mapfile -t found < <(
            find "app/build/outputs/apk/$SOURCE_VARIANT" -maxdepth 1 -type f -name '*.apk' | sort
          )
          if [[ "${#found[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one $SOURCE_VARIANT APK, found ${#found[@]}"
            printf '%s\n' "${found[@]:-none}"
            exit 1
          fi

          cp "${found[0]}" "dist/$APK_NAME"

          # The staging directory is the release payload. Anything else in it,
          # including mapping files, reports or logs, would end up published.
          if find dist -maxdepth 1 -type f ! -name '*.apk' -print -quit | grep -q .; then
            echo "::error::The staging directory contains a file that is not an APK"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          if [[ "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -ne 1 ]]; then
            echo "::error::Expected exactly one staged APK"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi

          ls -l dist

      # The gate that would have caught this before it shipped, and the reason it exists: R8 does
      # not read assets/xposed_init, so a release build silently removed the entry point - and the
      # whole injected runtime with it - while the APK still installed, still declared
      # xposedmodule and still named the class. No other gate in this repository builds the release
      # variant, so every one of them passed. This runs on the staged APK, before it is published,
      # and it fails rather than skipping.
      - name: Prove the release APK can be loaded as a legacy LSPosed module
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/quality/test_check_apk_loader_contract.py
          for apk in dist/*.apk; do
            python3 tools/quality/check_apk_loader_contract.py \
              --apk "$apk" \
              --expect-class com.wax.module.xposed.core.FeatureLoader
          done

      - name: Verify the APK signatures and update certificate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found"
            exit 1
          fi
          if [[ -z "${EXPECTED_SIGNING_CERT_SHA256:-}" ]]; then
            echo "::error::Expected WA X signing certificate fingerprint is unavailable"
            exit 1
          fi

          echo "### APK signature verification" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          for apk in dist/*.apk; do
            if ! VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1)"; then
              echo "::error::apksigner rejected $apk"
              printf "%s\n" "$VERIFY_OUTPUT" >&2
              exit 1
            fi

            CERT_DIGEST_LINE="$(grep -im1 'certificate SHA-256 digest:' <<< "$VERIFY_OUTPUT" || true)"
            ACTUAL_SIGNING_CERT_SHA256="$(
              sed -E 's/^.*certificate SHA-256 digest:[[:space:]]*//I' <<< "$CERT_DIGEST_LINE" |
                tr -d '[:space:]:' |
                tr '[:lower:]' '[:upper:]'
            )"

            if [[ ! "$ACTUAL_SIGNING_CERT_SHA256" =~ ^[0-9A-F]{64}$ ]]; then
              echo "::error::Could not read the signing certificate SHA-256 from $apk"
              printf "%s\n" "$VERIFY_OUTPUT" >&2
              exit 1
            fi
            if [[ "$ACTUAL_SIGNING_CERT_SHA256" != "$EXPECTED_SIGNING_CERT_SHA256" ]]; then
              echo "::error::$apk is signed by a different certificate"
              echo "Expected certificate SHA-256: $EXPECTED_SIGNING_CERT_SHA256" >&2
              echo "Actual certificate SHA-256:   $ACTUAL_SIGNING_CERT_SHA256" >&2
              exit 1
            fi

            {
              echo "**$(basename "$apk")**"
              echo
              echo "- WA X update certificate SHA-256: `$ACTUAL_SIGNING_CERT_SHA256`"
              echo "- Signature matches configured update key: **yes**"
              echo
              echo '```'
              printf "%s\n" "$VERIFY_OUTPUT"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
      # The published version is checked against the tag here, inside the APK,
      # so a stale or mismatched artifact can never be released.
      - name: Verify the version baked into the APKs
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
          IS_TAG: ${{ needs.preflight.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail

          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          if [[ -z "$AAPT2" ]]; then
            echo "::error::aapt2 was not found"
            exit 1
          fi

          for apk in dist/*.apk; do
            BADGING="$("$AAPT2" dump badging "$apk")"
            MANIFEST_VERSION="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n 1)"
            MANIFEST_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n 1)"

            if [[ -z "$MANIFEST_VERSION" || -z "$MANIFEST_CODE" ]]; then
              echo "::error::Could not read the version from $apk"
              exit 1
            fi
            if [[ "$MANIFEST_CODE" != "$VERSION_CODE" ]]; then
              echo "::error::$apk has versionCode $MANIFEST_CODE, expected $VERSION_CODE"
              exit 1
            fi
            if [[ "$IS_TAG" == "true" && "$MANIFEST_VERSION" != "$VERSION" ]]; then
              echo "::error::$apk has versionName $MANIFEST_VERSION, expected $VERSION"
              exit 1
            fi
            echo "$(basename "$apk"): versionName=$MANIFEST_VERSION versionCode=$MANIFEST_CODE"
          done

      - name: Upload the APK artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: dist/*.apk
          if-no-files-found: error
          # APKs are already compressed; re-deflating them only wastes minutes.
          compression-level: 0
          retention-days: 14
  release:
    name: Publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - preflight
      - package
      - strict-verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    cache-mode: none
    permissions:
      contents: write
      # Supplementary supply-chain provenance for the published binaries. It is
      # recorded after the release exists, and it is never allowed to block or
      # undo a release that already succeeded.
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout the release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Re-resolve the version from the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^waxVersionName=//p' gradle.properties | tail -n 1 | tr -d '\r')"
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the configured version $TAG"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "apk_name=WA-X-v$VERSION.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Download the signed APKs from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: dist

      - name: Validate the release payload
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        shell: bash
        run: |
          set -euo pipefail

          # Only the APKs are inspected as the payload; notes.md is generated below and
          # is not part of what gets published.
          if find dist -type f ! -name '*.apk' -print -quit | grep -q .; then
            echo "::error::The release payload contains a file that is not an APK"
            find dist -type f -print
            exit 1
          fi
          if find dist -mindepth 2 -type f -print -quit | grep -q .; then
            echo "::error::The release payload contains a nested directory"
            find dist -mindepth 2 -print
            exit 1
          fi

          mapfile -t apks < <(find dist -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one APK for the release, found ${#apks[@]}"
            printf '%s\n' "${apks[@]:-none}"
            exit 1
          fi

          if [[ ! -f "dist/$APK_NAME" ]]; then
            echo "::error::Missing expected release asset: $APK_NAME"
            ls -1 dist
            exit 1
          fi

          # The changelog is the single source of truth, but it accumulates: posting the
          # whole file would put every previous release on this release's page. The
          # notes are the first section of the changelog, taken as everything before the
          # next version heading.
          #
          # Both brand spellings are headings: `WA X <version>` today and `WaEnhancer
          # <version>` for everything before the rename. The earlier pattern matched
          # `word <version>`, which never matched `WA X 1.1.0` - the brand is two words -
          # so the section did not end where it claimed to and the first beta after a
          # previous release would have published that release's notes with its own.
          awk '
            NR == 1 { print; seen = 1; next }
            seen && /^(WA X|WaEnhancer) [0-9]+\.[0-9]+\.[0-9]+/ { exit }
            seen { print }
          ' changelog.txt > notes.md

          if [[ ! -s notes.md ]]; then
            echo "::error::Could not extract the release notes from changelog.txt"
            exit 1
          fi
          if ! grep -qF "WA X $VERSION" notes.md; then
            echo "::error::changelog.txt does not announce WA X $VERSION"
            head -n 3 changelog.txt
            exit 1
          fi

      - name: Generate SPDX SBOM for the exact APK
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/${{ steps.version.outputs.apk_name }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.apk

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.apk
          sbom-path: sbom.spdx.json
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # Whether this is a pre-release is decided by the version, not by the person cutting
          # it: a testing build must not become the repository's Latest release and demote the
          # last stable one. The rule and its cases live in the tool, which this step trusts
          # rather than re-deriving.
          python3 tools/ci/test_release_publication.py
          mapfile -t PUBLICATION < <(python3 tools/ci/release_publication.py --version "$VERSION")
          if [[ "${#PUBLICATION[@]}" -ne 1 ]]; then
            echo "::error::The publication flags for $VERSION are ambiguous: ${PUBLICATION[*]}"
            exit 1
          fi

          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "WA X $VERSION" \
            --notes-file notes.md \
            --verify-tag \
            "${PUBLICATION[@]}"

          echo "### Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publication: ${PUBLICATION[*]} (a version with a pre-release suffix is never \`--latest\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Assets: $(ls -1 dist | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
  telegram:
    name: Publish the validated APK to Telegram
    if: >-
      ${{
        !cancelled() &&
        github.event_name != 'pull_request' &&
        needs.package.result == 'success' &&
        needs.strict-verdict.result == 'success' &&
        (needs.release.result == 'success' || needs.release.result == 'skipped') &&
        (
          startsWith(github.ref, 'refs/tags/v') ||
          github.ref_name == 'main' ||
          github.ref_name == 'ci/telegram-release-publisher-test'
        ) &&
        (github.event_name != 'workflow_dispatch' || inputs.publish_to_telegram)
      }}
    needs:
      - preflight
      - package
      - strict-verdict
      - release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    cache-mode: read
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout publishing helpers and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci/telegram-requirements.txt

      - name: Download the APK from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: dist

      - name: Validate helpers and prepare publication metadata
        id: metadata
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          IS_RELEASE: ${{ needs.preflight.outputs.release }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail

          python3 -m py_compile tools/ci/generate_telegram_changelog.py tools/ci/publish_telegram_mtproto.py
          python3 tools/ci/test_telegram_changelog.py
          python3 tools/ci/test_publish_telegram_mtproto.py

          mapfile -t apks < <(find dist -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one APK from this run, found ${#apks[@]}"
            printf '%s\n' "${apks[@]:-none}"
            exit 1
          fi

          APK="${apks[0]}"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          BYTES="$(stat -c '%s' "$APK")"
          HUMAN_SIZE="$(numfmt --to=iec-i --suffix=B "$BYTES")"

          if [[ "$IS_RELEASE" == "true" ]]; then
            TYPE=stable
            TELEGRAM_THREAD_ID=4
            TELEGRAM_TOPIC_NAME="Updates & Releases"
            RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            # Same section as the GitHub Release notes, cut at the next heading. See
            # the release job for why both brand spellings are matched.
            awk '
              NR == 1 { print; seen = 1; next }
              seen && /^(WA X|WaEnhancer) [0-9]+\.[0-9]+\.[0-9]+/ { exit }
              seen { print }
            ' changelog.txt > telegram-changelog.txt
          else
            TYPE=development
            TELEGRAM_THREAD_ID=18
            TELEGRAM_TOPIC_NAME="Beta Testing"
            RELEASE_URL=""
            BASE_REF="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
            if [[ -z "$BASE_REF" ]]; then
              BASE_REF="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            fi
            python3 tools/ci/generate_telegram_changelog.py \
              --base "$BASE_REF" \
              --head HEAD \
              --output telegram-changelog.txt
          fi

          if [[ ! -s telegram-changelog.txt ]]; then
            echo "::error::Telegram changelog generation produced an empty file"
            exit 1
          fi

          {
            echo "apk=$APK"
            echo "filename=$(basename "$APK")"
            echo "sha256=$SHA256"
            echo "bytes=$BYTES"
            echo "human_size=$HUMAN_SIZE"
            echo "type=$TYPE"
            echo "thread_id=$TELEGRAM_THREAD_ID"
            echo "topic_name=$TELEGRAM_TOPIC_NAME"
            echo "release_url=$RELEASE_URL"
            echo "workflow_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "marker_name=telegram-published-$TYPE-$TELEGRAM_THREAD_ID-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Telegram publication metadata"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Transport | Direct MTProto via Kurigram |"
            echo "| Group | @WAXposed |"
            echo "| Topic | $TELEGRAM_TOPIC_NAME |"
            echo "| Topic ID | $TELEGRAM_THREAD_ID |"
            echo "| File | $(basename "$APK") |"
            echo "| Size | $HUMAN_SIZE |"
            echo "| SHA-256 | $SHA256 |"
            echo "| Channel | $TYPE |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Render the Telegram publication in dry-run mode
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          python3 tools/ci/publish_telegram_mtproto.py \
            --dry-run \
            --file "${{ steps.metadata.outputs.apk }}" \
            --type "${{ steps.metadata.outputs.type }}" \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --sha256 "${{ steps.metadata.outputs.sha256 }}" \
            --size "${{ steps.metadata.outputs.human_size }}" \
            --changelog-file telegram-changelog.txt \
            --release-url "${{ steps.metadata.outputs.release_url }}" \
            --workflow-url "${{ steps.metadata.outputs.workflow_url }}" \
            --chat-id "@WAXposed" \
            --thread-id "${{ steps.metadata.outputs.thread_id }}"

      - name: Prevent accidental duplicate Telegram publications
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER_NAME: ${{ steps.metadata.outputs.marker_name }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish || false }}
        run: |
          set -euo pipefail

          SHOULD_PUBLISH=true
          if [[ "$FORCE_PUBLISH" != "true" ]]; then
            EXISTING="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$MARKER_NAME&per_page=1" \
                --jq '.total_count'
            )"
            if [[ "$EXISTING" != "0" ]]; then
              SHOULD_PUBLISH=false
              echo "An existing Telegram publication marker was found for this build and topic."
            fi
          fi

          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Validate Telegram secrets
        if: steps.guard.outputs.should_publish == 'true'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          set +x
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_API_ID TELEGRAM_API_HASH; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
            echo "$name: configured"
          done

      - name: Install pinned MTProto publisher dependencies
        if: steps.guard.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install \
            --disable-pip-version-check \
            --no-input \
            -r tools/ci/telegram-requirements.txt

          python3 - <<'PY'
          import pyrogram

          print(f"Kurigram/Pyrogram runtime version: {pyrogram.__version__}")
          try:
              import tgcrypto
              print("TgCrypto acceleration: enabled")
          except ImportError:
              raise SystemExit("TgCrypto acceleration is missing")
          try:
              import uvloop
              print(f"uvloop acceleration: enabled ({uvloop.__version__})")
          except ImportError:
              raise SystemExit("uvloop acceleration is missing")
          PY

      - name: Publish APK and changelog through direct MTProto
        id: telegram_publish
        if: steps.guard.outputs.should_publish == 'true'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          set +x

          python3 tools/ci/publish_telegram_mtproto.py \
            --file "${{ steps.metadata.outputs.apk }}" \
            --type "${{ steps.metadata.outputs.type }}" \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --sha256 "${{ steps.metadata.outputs.sha256 }}" \
            --size "${{ steps.metadata.outputs.human_size }}" \
            --changelog-file telegram-changelog.txt \
            --release-url "${{ steps.metadata.outputs.release_url }}" \
            --workflow-url "${{ steps.metadata.outputs.workflow_url }}" \
            --chat-id "@WAXposed" \
            --thread-id "${{ steps.metadata.outputs.thread_id }}"

      - name: Record successful Telegram publication
        if: steps.guard.outputs.should_publish == 'true' && steps.telegram_publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p telegram-publication-marker
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "sha=$GITHUB_SHA"
            echo "channel=${{ steps.metadata.outputs.type }}"
            echo "topic=${{ steps.metadata.outputs.topic_name }}"
            echo "thread_id=${{ steps.metadata.outputs.thread_id }}"
            echo "transport=mtproto-kurigram"
            echo "announcement_message_id=${{ steps.telegram_publish.outputs.announcement_message_id }}"
            echo "document_message_id=${{ steps.telegram_publish.outputs.document_message_id }}"
          } > telegram-publication-marker/published.txt

      - name: Upload Telegram publication marker
        if: steps.guard.outputs.should_publish == 'true' && steps.telegram_publish.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.marker_name }}
          path: telegram-publication-marker/published.txt
          if-no-files-found: error
          retention-days: 30

      - name: Summarize Telegram publication
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Telegram distribution"
            echo
            echo "- Transport: Direct MTProto / Kurigram 2.2.26"
            echo "- Group: @WAXposed"
            echo "- Topic: ${{ steps.metadata.outputs.topic_name || 'not-evaluated' }}"
            echo "- Topic ID: ${{ steps.metadata.outputs.thread_id || 'n/a' }}"
            echo "- Duplicate guard: ${{ steps.guard.outputs.should_publish || 'not-evaluated' }}"
            if [[ "${{ steps.guard.outputs.should_publish }}" == "true" ]]; then
              echo "- Changelog message: ${{ steps.telegram_publish.outputs.announcement_message_id || 'n/a' }}"
              echo "- APK message: ${{ steps.telegram_publish.outputs.document_message_id || 'n/a' }}"
            else
              echo "- Result: existing publication marker found; Telegram post skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  ubuntu26-canary:
    name: Ubuntu 26.04 forward-compatibility canary
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    cache-mode: read
    permissions:
      contents: read
    steps:
      - *checkout_full
      - *setup_java
      - name: Set up Gradle read-only on the canary
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
          cache-read-only: true
          add-job-summary: on-failure
      - name: Validate the next GitHub-hosted Ubuntu image
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew $GRADLE_ARGS --warning-mode=fail assembleDebug testDebugUnitTest lintDebug
