# =============================================================================
# WA X — Android CI (single source of truth for building and releasing)
# =============================================================================
#
# This is the ONLY workflow in the repository. It owns the whole pipeline:
# build, unit tests, Android lint, formatting, static analysis, compatibility
# matrix validation, baseline regression gate, APK signing, signature and
# manifest verification, and GitHub Release publishing.
#
# Event matrix
#   pull_request      Verify only. Builds, tests, lints and signs debug APKs,
#                     but uploads nothing and publishes nothing.
#   push to master    The same verification, then publishes the signed debug
#                     APKs as a CI artifact for manual testing. No Release.
#   push of tag v*    The release path: release-signed APKs, signature and
#                     manifest verification, then a GitHub Release.
#   workflow_dispatch Same as a master push, or the release path when dispatched
#                     on an existing tag.
#
# Release contract (enforced, not documented-only)
#   * The tag, the configured version and the version baked into the APK are
#     all the same string. Any mismatch fails the run.
#     gradle.properties -> waxVersionName == <tag> without the leading "v"
#     APK versionName   == waxVersionName
#     APK versionCode   == waxVersionCode
#   * Only a tag build is signed with the release keystore. Every other build
#     is signed with the debug key, so a release key never signs an unreleased
#     artifact and a debug-signed APK never reaches a Release.
#   * A GitHub Release is created only from a tag, never from a branch push.
#   * Release assets are exactly two .apk files and nothing else. The staging
#     directory is rejected if it holds any other file type.
#   * Release notes come from changelog.txt, which must be present and must
#     name the released version.
#
# Actions are pinned to commit SHAs so the pipeline cannot be changed from a
# pull request or by a compromised tag.
# =============================================================================

name: Android CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

# Superseded runs on a branch are pointless, so they are cancelled. A release
# run must never be cancelled halfway through.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_ARGS: --no-daemon --stacktrace
  # Explicit APK growth budget for the regression gate. The 1.7.0 platform and
  # resolver work grew the debug APK by ~3.0%. The budget is a reviewed number,
  # not a default: lower it as the baseline is paid down, and raise it only with
  # a reason recorded in the pull request.
  MAX_APK_GROWTH_PCT: '4.0'

jobs:
  build:
    name: Verify, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.is_tag }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # The baseline gate and the compatibility validator both need history.
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      # The single point where the tag, the configured version and the release
      # decision are derived. Every later step reads these outputs instead of
      # re-deriving them, so the pipeline cannot disagree with itself.
      - name: Resolve version and validate the tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          property() {
            local value
            value="$(sed -n "s/^$1=//p" gradle.properties | tail -n 1 | tr -d '\r')"
            if [[ -z "$value" ]]; then
              echo "::error::$1 is missing from gradle.properties"
              exit 1
            fi
            echo "$value"
          }

          VERSION="$(property waxVersionName)"
          VERSION_CODE="$(property waxVersionCode)"
          TAG="v$VERSION"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::waxVersionName is not a release version: $VERSION"
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::waxVersionCode is not an integer: $VERSION_CODE"
            exit 1
          fi

          IS_TAG=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            IS_TAG=true
            EVENT_TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$EVENT_TAG" != "$TAG" ]]; then
              echo "::error::Tag $EVENT_TAG does not match the configured version $TAG"
              exit 1
            fi
            if gh release view "$EVENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Release $EVENT_TAG already exists; bump the version instead of reusing it"
              exit 1
            fi
          fi

          SHA8="${GITHUB_SHA:0:8}"
          if [[ "$IS_TAG" == "true" ]]; then
            ARTIFACT="apk-$VERSION-$SHA8"
          else
            ARTIFACT="apk-$VERSION-ci-$SHA8"
          fi

          {
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "tag=$TAG"
            echo "is_tag=$IS_TAG"
            echo "artifact_name=$ARTIFACT"
          } >> "$GITHUB_OUTPUT"

          echo "### Version resolution" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`$VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version code | \`$VERSION_CODE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release tag | \`$TAG\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mode | $(if [[ "$IS_TAG" == true ]]; then echo 'release'; else echo 'verification only'; fi) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA:0:8}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug APKs and run the unit tests
        run: |
          ./gradlew $GRADLE_ARGS \
            assembleDebug \
            testDebugUnitTest

      - name: Run Android lint
        run: |
          ./gradlew $GRADLE_ARGS --continue \
            lintDebug

      # The reference baseline is taken from the base revision (pull-request base
      # branch, pre-push commit or HEAD^), never from this change's own copy, so a
      # change cannot raise the limits it is measured against by editing
      # baseline.json in the same commit.
      - name: Enforce the baseline regression gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          MAX_APK_GROWTH_PCT: ${{ env.MAX_APK_GROWTH_PCT }}
        run: |
          python3 tools/baseline/check_baseline.py \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --pr-base-sha "$PR_BASE_SHA" \
            --before-sha "$BEFORE_SHA" \
            --max-apk-growth "$MAX_APK_GROWTH_PCT"

      # Formatting is a gate. detekt runs against its own baseline in report mode
      # so it surfaces debt without blocking, and is tightened as the baseline
      # shrinks.
      - name: Check formatting and static analysis
        run: |
          ./gradlew $GRADLE_ARGS \
            spotlessCheck \
            detekt

      # The compatibility matrix must stay in sync with the source tree, must
      # cover every registered feature, and must not claim `supported` without
      # recorded resolver evidence. docs/COMPATIBILITY.md is generated, so a
      # stale render fails too.
      - name: Validate the compatibility matrix
        run: |
          set -euo pipefail
          python3 tools/compatibility/test_validator.py
          python3 tools/compatibility/validate_compatibility.py
          python3 tools/compatibility/sync_generated.py --check

      - name: Import the release keystore
        if: steps.version.outputs.is_tag == 'true'
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in KEY_STORE KEY_STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done

          printf '%s\n' "androidStorePassword=$KEY_STORE_PASSWORD" >> gradle.properties
          printf '%s\n' "androidKeyAlias=$KEY_ALIAS" >> gradle.properties
          printf '%s\n' "androidKeyPassword=$KEY_PASSWORD" >> gradle.properties
          printf '%s\n' "androidStoreFile=key.jks" >> gradle.properties
          printf '%s' "$KEY_STORE" | base64 --decode > key.jks

          # key.jks is read back here so a truncated or mistyped secret fails
          # now, in the build job, instead of halfway through a release.
          if ! keytool -list -keystore key.jks \
              -storepass "$KEY_STORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The release keystore could not be opened with the configured alias"
            exit 1
          fi

      # One staging directory, deterministic names, and nothing that is not an
      # APK may enter it. Tag runs assemble the release variants with the release
      # key; every other run keeps the debug-signed APKs, which are built and
      # signed but never published.
      - name: Build and stage the APKs
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_TAG: ${{ steps.version.outputs.is_tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          # WA X ships one APK that hooks both WhatsApp builds, so there is exactly
          # one output to stage and one asset to publish. The name is deterministic:
          # the release uses the version alone, a branch run adds the commit so a test
          # build is never mistaken for a release.
          if [[ "$IS_TAG" == "true" ]]; then
            ./gradlew $GRADLE_ARGS clean \
              assembleRelease \
              -PreleaseTag="$RELEASE_TAG"
            SOURCE_VARIANT=release
            APK_NAME="WA-X-v$VERSION.apk"
          else
            SOURCE_VARIANT=debug
            SHA8="${GITHUB_SHA:0:8}"
            APK_NAME="WA-X-$VERSION-ci-$SHA8.apk"
          fi

          mapfile -t found < <(
            find "app/build/outputs/apk/$SOURCE_VARIANT" -maxdepth 1 -type f -name '*.apk' | sort
          )
          if [[ "${#found[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one $SOURCE_VARIANT APK, found ${#found[@]}"
            printf '%s\n' "${found[@]:-none}"
            exit 1
          fi

          cp "${found[0]}" "dist/$APK_NAME"

          # The staging directory is the release payload. Anything else in it,
          # including mapping files, reports or logs, would end up published.
          if find dist -maxdepth 1 -type f ! -name '*.apk' -print -quit | grep -q .; then
            echo "::error::The staging directory contains a file that is not an APK"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          if [[ "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -ne 1 ]]; then
            echo "::error::Expected exactly one staged APK"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi

          ls -l dist

      - name: Verify the APK signatures
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found"
            exit 1
          fi

          {
            echo "### APK signature verification"
            echo
            for apk in dist/*.apk; do
              echo "**$(basename "$apk")**"
              echo
              echo '```'
              "$APKSIGNER" verify --verbose --print-certs "$apk"
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # The published version is checked against the tag here, inside the APK,
      # so a stale or mismatched artifact can never be released.
      - name: Verify the version baked into the APKs
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          IS_TAG: ${{ steps.version.outputs.is_tag }}
        shell: bash
        run: |
          set -euo pipefail

          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          if [[ -z "$AAPT2" ]]; then
            echo "::error::aapt2 was not found"
            exit 1
          fi

          for apk in dist/*.apk; do
            BADGING="$("$AAPT2" dump badging "$apk")"
            MANIFEST_VERSION="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n 1)"
            MANIFEST_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n 1)"

            if [[ -z "$MANIFEST_VERSION" || -z "$MANIFEST_CODE" ]]; then
              echo "::error::Could not read the version from $apk"
              exit 1
            fi
            if [[ "$MANIFEST_CODE" != "$VERSION_CODE" ]]; then
              echo "::error::$apk has versionCode $MANIFEST_CODE, expected $VERSION_CODE"
              exit 1
            fi
            if [[ "$IS_TAG" == "true" && "$MANIFEST_VERSION" != "$VERSION" ]]; then
              echo "::error::$apk has versionName $MANIFEST_VERSION, expected $VERSION"
              exit 1
            fi
            echo "$(basename "$apk"): versionName=$MANIFEST_VERSION versionCode=$MANIFEST_CODE"
          done

      - name: Upload the APK artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: dist/*.apk
          if-no-files-found: error
          # APKs are already compressed; re-deflating them only wastes minutes.
          compression-level: 0
          retention-days: 14

  release:
    name: Publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Supplementary supply-chain provenance for the published binaries. It is
      # recorded after the release exists, and it is never allowed to block or
      # undo a release that already succeeded.
      id-token: write
      attestations: write

    steps:
      - name: Checkout the release metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Re-resolve the version from the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^waxVersionName=//p' gradle.properties | tail -n 1 | tr -d '\r')"
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the configured version $TAG"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "apk_name=WA-X-v$VERSION.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Download the signed APKs from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Validate the release payload
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        shell: bash
        run: |
          set -euo pipefail

          if find dist -type f ! -name '*.apk' -print -quit | grep -q .; then
            echo "::error::The release payload contains a file that is not an APK"
            find dist -type f -print
            exit 1
          fi
          if find dist -mindepth 2 -type f -print -quit | grep -q .; then
            echo "::error::The release payload contains a nested directory"
            find dist -mindepth 2 -print
            exit 1
          fi

          mapfile -t apks < <(find dist -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one APK for the release, found ${#apks[@]}"
            printf '%s\n' "${apks[@]:-none}"
            exit 1
          fi

          if [[ ! -f "dist/$APK_NAME" ]]; then
            echo "::error::Missing expected release asset: $APK_NAME"
            ls -1 dist
            exit 1
          fi

          if ! grep -qF "WA X $VERSION" changelog.txt; then
            echo "::error::changelog.txt does not announce WA X $VERSION"
            exit 1
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "WA X $VERSION" \
            --notes-file changelog.txt \
            --verify-tag \
            --latest

          echo "### Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Assets: $(ls -1 dist | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Record build provenance for the published APKs
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/*.apk