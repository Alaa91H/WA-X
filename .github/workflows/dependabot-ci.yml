name: Dependabot CI

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug variants and run unit tests
        run: ./gradlew assembleWhatsappDebug assembleBusinessDebug testWhatsappDebugUnitTest testBusinessDebugUnitTest

      - name: Build release variants
        run: ./gradlew assembleWhatsappRelease assembleBusinessRelease

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          ./gradlew --continue lintWhatsappDebug lintBusinessDebug
          status=$?
          find app/build -type f -name 'lint-results-*.txt' -print0 2>/dev/null | while IFS= read -r -d '' report; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done
          exit $status
