name: Android CI

on:
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  build:
    name: Build and test Android
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug and release variants
        run: ./gradlew assembleWhatsappDebug assembleBusinessDebug assembleWhatsappRelease assembleBusinessRelease

      - name: Run unit tests
        run: ./gradlew testWhatsappDebugUnitTest testBusinessDebugUnitTest
