name: WhatsApp Compatibility Probe

on:
  push:
    branches:
      - "compat/whatsapp-2.26.32.84-clean"

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Download official WhatsApp APK
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent "Mozilla/5.0" \
            --output WhatsApp.apk \
            "https://www.whatsapp.com/android/current/WhatsApp.apk"
          test -s WhatsApp.apk
          sha256sum WhatsApp.apk

      - name: Verify package and version
        run: |
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n 1)"
          if [ -z "$APKANALYZER" ]; then
            echo "::error::apkanalyzer not found"
            exit 1
          fi
          APP_ID="$("$APKANALYZER" manifest application-id WhatsApp.apk)"
          VERSION="$("$APKANALYZER" manifest version-name WhatsApp.apk)"
          echo "applicationId=$APP_ID"
          echo "versionName=$VERSION"
          test "$APP_ID" = "com.whatsapp"
          test "$VERSION" = "2.26.39.71"

      - name: Extract DEX files
        run: |
          mkdir -p whatsapp-dex
          while IFS= read -r dex; do
            unzip -p WhatsApp.apk "$dex" > "whatsapp-dex/$(basename "$dex")"
          done < <(unzip -Z1 WhatsApp.apk | grep -E '^classes([0-9]+)?\.dex$')
          test "$(find whatsapp-dex -name '*.dex' | wc -l)" -gt 0

      - name: Check critical DexKit anchors
        shell: bash
        run: |
          set -u
          required=(
            "presencestatemanager/setAvailable/new-state"
            "HandleMeComposing/sendComposing"
            "SharedMessageProcessor/handlePlaintext"
            "ProtocolTreeNode/getAttributeJid"
            "ReadReceiptUtils/buildReadReceiptHandler malformed"
            "chatInfo/incrementUnseenImportantMessageCount"
            "UPDATE_MESSAGE_MAIN_BROADCAST_SCAN_SQL"
            "FMessage/getSenderUserJid/key.id"
            "MessageHandler/start"
            "INSERT_VIEW_ONCE_SQL"
            "conversation/createconversation"
            "voip/callStateChangedOnUIThread"
            "app/send-presence-subscription jid="
            "getPinnedJids/QUERY_CHAT_SETTINGS"
            "WaJidMapRepository/getPhoneJidByAccountUserJid"
            "WaJidMapRepository/getAccountUserJidByPhoneJid"
            "VideoTranscoder/transcodeVideoNew/"
            "MediaDataVideoConfiguration("
            "ProcessImageQuality("
            "ProfilePhotoManager/sendGetProfilePhoto"
            "StatusStore/GET_STATUS_BY_KEY"
            "StatusReceiptStore/insertOrUpdateSeenReceiptForStatus"
            "ConnectionWriter/sendReadReceipts"
            "ReadReceipts/sendReceiptForIncomingMessage"
          )

          missing=0
          for anchor in "${required[@]}"; do
            if grep -aR -F -q -- "$anchor" whatsapp-dex; then
              echo "FOUND: $anchor"
            else
              echo "::error::MISSING DexKit anchor: $anchor"
              missing=$((missing + 1))
            fi
          done

          if ! grep -aR -F -q -- "msgstore/edit/revoke" whatsapp-dex \
             && ! grep -aR -F -q -- "msgstore/revoking/" whatsapp-dex; then
            echo "::error::MISSING revoke fallback anchors"
            missing=$((missing + 1))
          else
            echo "FOUND: revoke anchor"
          fi

          if ! grep -aR -F -q -- "archive/set-content-indicator-to-empty" whatsapp-dex \
             && ! grep -aR -F -q -- "archive/Unsupported mode in ArchivePreviewView:" whatsapp-dex; then
            echo "::error::MISSING archive fallback anchors"
            missing=$((missing + 1))
          else
            echo "FOUND: archive anchor"
          fi

          echo "missing_critical_anchors=$missing"
          test "$missing" -eq 0
