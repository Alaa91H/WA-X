name: Agent2 discovery fixture validation

on:
  push:
    branches:
      - agent2/auto-compat-discovery-prep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source discovery fixture tests
        run: python3 tools/compatibility/discovery/test_discovery.py
      - name: Check CLI argument contract without network access
        run: python3 tools/compatibility/discovery/cli.py --help
